<!doctype html>
<html>
    <head>
        <title>js calculator</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>calculator</h1>
        <div id="calculator">
            <div id="display-screen"></div>
            <button id="1-key" class="key">1</button>
            <button id="2-key" class="key">2</button>
            <button id="3-key" class="key">3</button>
            <button id="plus-sign-key" class="key">+</button>
            <button id="minus-sign-key" class="key">-</button>
            <button id="equals-sign-key" class="key">=</button>
        </div>

        <script src="app.js"></script>
    </body>
    
</html>
