<!doctype html>
<html>
    <head>
        <title>js calculator</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        
        <h1>calculator</h1>
       
        <div id="calculator">
            <div id="display-screen">0</div>
            <button id="7-key" class="key">7</button>
            <button id="8-key" class="key">8</button>
            <button id="9-key" class="key">9</button>
            <button id="3-key" class="key">4</button>
            <button id="5-key" class="key">5</button>
            <button id="6-key" class="key">6</button>
            <button id="1-key" class="key">1</button>
            <button id="2-key" class="key">2</button>
            <button id="3-key" class="key">3</button>
            <button id="addition-key" class="key">+</button>
            <button id="zero-key" class="key">0</button>
            <button id="subtraction-key" class="key">-</button>
            <button id="back-key" class="key">back</button>
            <button id="clear-key" class="key">C</button>
            <button id="equals-key" class="key">=</button>
        </div>

        <script src="app.js"></script>
    </body>
    
</html>
